<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reckoning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Impianto: intestazione a gradiente fissa in alto con le schede a pillola, contenuto in pannelli arrotondati
   su tutta la larghezza utile. Stessa lingua visiva di Solo Leveling (tema moderno): Poppins + Inter, viola e rosa. */
:root{
  --bg:#F3F0FA; --bg-glow:#FBE9F3;
  --panel:#FFFFFF; --panel-2:#F7F3FE; --input:#FBFAFF;
  --border:#E4DDF3; --border-2:#EFEAF8;
  --ink:#2E2A45; --dim:#6E678F; --faint:#A7A2BF;
  --gold:#7C4DEB; --brass:#9A70E0; --ember:#EC5C97; --moss:#22A06B;
  --ok-bg:#E3F6EE; --ok-fg:#16794F; --ok-br:#B6E5CF;
  --warn-bg:#FDF3DF; --warn-fg:#8A620A; --warn-br:#F1D9A3;
  --bad-bg:#FDE6EC; --bad-fg:#B42A55; --bad-br:#F4B9CA;
  --info-bg:#EEF1FD; --info-fg:#4453A6; --info-br:#CCD3F5;
  --shadow:rgba(108,78,180,.13);
  --grad:linear-gradient(120deg,#F38BA8 0%,#C38CF0 52%,#8E8CF5 100%);
  --on-grad:#FFFFFF; --on-grad-pill:#7C4DEB;
  --c-unfav:#E0457F; --c-fav:#3D8FD9; --c-bar:#9488C8; --c-line:#7C4DEB; --c-grid:#ECE7F7; --c-axis:#BDB4DA;
  --radius:18px;
  --f-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16142A; --bg-glow:#2A2150;
    --panel:#201D38; --panel-2:#2A2648; --input:#191732;
    --border:#36315A; --border-2:#2C2849;
    --ink:#ECEAF7; --dim:#A39FC0; --faint:#77729A;
    --gold:#C4A5FF; --brass:#9C86D6; --ember:#FF7AB0; --moss:#34C38F;
    --ok-bg:rgba(52,195,143,.14); --ok-fg:#7BE0B5; --ok-br:rgba(52,195,143,.35);
    --warn-bg:rgba(245,185,74,.14); --warn-fg:#F5C76A; --warn-br:rgba(245,185,74,.35);
    --bad-bg:rgba(242,85,122,.15); --bad-fg:#FF8FAA; --bad-br:rgba(242,85,122,.4);
    --info-bg:rgba(124,140,245,.15); --info-fg:#AEB8FA; --info-br:rgba(124,140,245,.38);
    --shadow:rgba(0,0,0,.35);
    --c-bar:#7A70B4; --c-line:#C4A5FF; --c-grid:#2D2950; --c-axis:#4A4478;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16142A; --bg-glow:#2A2150;
  --panel:#201D38; --panel-2:#2A2648; --input:#191732;
  --border:#36315A; --border-2:#2C2849;
  --ink:#ECEAF7; --dim:#A39FC0; --faint:#77729A;
  --gold:#C4A5FF; --brass:#9C86D6; --ember:#FF7AB0; --moss:#34C38F;
  --ok-bg:rgba(52,195,143,.14); --ok-fg:#7BE0B5; --ok-br:rgba(52,195,143,.35);
  --warn-bg:rgba(245,185,74,.14); --warn-fg:#F5C76A; --warn-br:rgba(245,185,74,.35);
  --bad-bg:rgba(242,85,122,.15); --bad-fg:#FF8FAA; --bad-br:rgba(242,85,122,.4);
  --info-bg:rgba(124,140,245,.15); --info-fg:#AEB8FA; --info-br:rgba(124,140,245,.38);
  --shadow:rgba(0,0,0,.35);
  --c-bar:#7A70B4; --c-line:#C4A5FF; --c-grid:#2D2950; --c-axis:#4A4478;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:radial-gradient(1100px 600px at 85% -10%, var(--bg-glow) 0%, transparent 65%), var(--bg);
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;
}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}

/* ---------- intestazione ---------- */
header.top{background:var(--grad);color:var(--on-grad);box-shadow:0 10px 30px rgba(140,90,200,.28);position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.head-inner{max-width:min(2100px,96vw);margin:0 auto;padding:18px 22px 0;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.mark{width:68px;height:68px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.12em;line-height:1.1}
.tagline{color:rgba(255,255,255,.9);font-size:14.5px;margin-top:4px;max-width:56ch}
.head-right{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-size:13.5px;color:rgba(255,255,255,.9)}
.chrome{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.head-right label{font-size:12.5px}
header.top input{background:rgba(255,255,255,.95);border:none;color:#2E2A45;border-radius:999px;padding:6px 14px;width:220px;max-width:60vw}
header.top .seg{background:rgba(255,255,255,.2);border:none}
header.top .seg button{color:#fff}
header.top .seg button[aria-pressed="true"]{background:#fff;color:var(--on-grad-pill)}
header.top button.act.ghost{background:rgba(255,255,255,.2);border:none;color:#fff;box-shadow:none}
.saved{min-height:18px;font-size:13px;color:#fff}
nav.tabs{max-width:min(2100px,96vw);margin:14px auto 0;padding:0 22px 12px;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{font-family:var(--f-display);font-weight:500;font-size:14px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:8px}
nav.tabs button:hover{background:rgba(255,255,255,.32)}
nav.tabs button[aria-current="true"]{background:#fff;color:var(--on-grad-pill);box-shadow:0 6px 16px rgba(80,40,140,.25)}
nav.tabs .badge{font-family:var(--f-body);font-size:11.5px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;background:#fff;color:#B42A55}
nav.tabs button[aria-current="true"] .badge{background:#B42A55;color:#fff}
nav.tabs .badge.soft{color:#8A620A}
nav.tabs button[aria-current="true"] .badge.soft{background:#8A620A;color:#fff}
header.top.compact .head-inner{padding-top:8px;align-items:center}
header.top.compact .mark{width:32px;height:32px}
header.top.compact .wordmark{font-size:17px}
header.top.compact .tagline,header.top.compact .head-right label,header.top.compact .saved{display:none}
header.top.compact .head-right{flex-direction:row;align-items:center}
header.top.compact nav.tabs{margin-top:8px;padding-bottom:8px}
header.top.compact nav.tabs button{font-size:12.5px;padding:5px 13px}

main{max-width:min(2100px,96vw);margin:0 auto;padding-block:24px 40px;padding-inline:22px}
@media (max-width:640px){
  .head-inner,nav.tabs{padding-inline:16px} main{padding-inline:16px}
  .head-right{margin-left:0;align-items:flex-start;width:100%}
  .chrome{justify-content:flex-start}
  .wordmark{font-size:22px} .mark{width:48px;height:48px}
  header.top{position:static}
}

/* ---------- pannelli ---------- */
.panel{background:var(--panel);border:1px solid var(--border-2);border-radius:var(--radius);padding:20px 24px 24px;margin-bottom:22px;box-shadow:0 1px 2px var(--shadow),0 12px 32px var(--shadow);min-width:0}
.panel > h2{font-size:18px;color:var(--ink);margin-bottom:6px}
.panel > h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grad);margin-right:10px;vertical-align:3px}
.hint{color:var(--dim);font-size:14px;margin:0 0 14px;max-width:92ch}
.hint + .hint{margin-top:-6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px}
.cols > .panel{margin-bottom:0}
.cols{margin-bottom:22px}

button{font-family:inherit}
button.act{font-family:var(--f-body);font-size:14px;font-weight:600;background:var(--grad);color:#fff;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;box-shadow:0 6px 16px rgba(170,100,220,.3);transition:transform .15s,box-shadow .15s}
button.act:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(170,100,220,.38)}
button.act.ghost{background:var(--panel);color:var(--gold);border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow)}
button.act.small{padding:4px 12px;font-size:13px}
button.danger{border:1px solid var(--bad-br);background:transparent;color:var(--bad-fg);padding:4px 12px;font-size:13px;border-radius:999px;cursor:pointer}
button.danger:hover{background:var(--bad-bg)}
button.link{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13.5px;font-weight:600;padding:2px 4px;border-radius:6px}
button.link:hover{text-decoration:underline}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input,select,textarea{background:var(--input);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:14.5px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(124,77,235,.15)}
input.num{width:104px;text-align:right;font-variant-numeric:tabular-nums}
input.num.short{width:76px}
input.wide{width:260px}
input.bad{border-color:var(--bad-fg);box-shadow:0 0 0 3px var(--bad-bg)}
textarea{width:100%;min-height:76px;resize:vertical;line-height:1.45}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;vertical-align:-3px}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label,.field > .lab{font-size:13px;color:var(--dim);font-weight:500}
.field input,.field select{width:100%}
.field input[type=checkbox]{width:16px;flex:none}
.field.span2{grid-column:span 2}
.field.full{grid-column:1 / -1}
.field .sub{font-size:12.5px;color:var(--dim)}
@media (max-width:520px){.field.span2{grid-column:auto}}
.fields.gen{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px 28px}
.fields.gen .field{gap:10px}
label.chk{display:flex;gap:8px;align-items:center;font-size:14.5px!important;color:var(--ink)!important;font-weight:600!important;cursor:pointer}
.inl{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:300px;font-size:13.5px;color:var(--dim)}
.inl input{width:76px!important}

/* ---------- tabelle ---------- */
.scroller{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border-2);vertical-align:middle}
thead th{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{border-top:1px solid var(--border);border-bottom:none;font-weight:700}
tr.strong td{font-weight:700}
tr.sep td{border-top:1px solid var(--border)}
td.neg{color:var(--bad-fg)}
.empty{color:var(--dim);font-style:italic;padding:14px 2px}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--panel);z-index:2}
.matrix tbody tr:hover td:first-child{background:var(--panel-2)}
.matrix td.yr{padding:6px 4px;text-align:right}
.matrix td.yr input{width:80px;padding:7px 7px;font-size:14px}
.matrix thead th.wrap{white-space:normal;line-height:1.25;max-width:84px}
.matrix td input.nome{width:250px}
.rowtools{display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.rowtools .tag{font-size:11.5px;padding:1px 8px}
button.link.del{color:var(--bad-fg)}
.matrix td.yr .calc{display:block;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;padding:2px 6px 0 0;white-space:nowrap}
.matrix th.yr{text-align:right;padding-right:14px}
.matrix tr.det > td{position:static;background:var(--panel-2);padding:16px 18px;border-bottom:1px solid var(--border)}
.matrix tr.det:hover{background:none}
.matrix tr.open > td{border-bottom-color:transparent}
td.tools{white-space:nowrap;text-align:right}
.detbox{position:sticky;left:18px;width:min(1180px,calc(100vw - 130px));display:flex;flex-direction:column;gap:16px}
.detbox h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-family:var(--f-body);font-weight:700;margin-bottom:8px}
.formula{background:var(--panel);border:1px dashed var(--border);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.formula b{color:var(--ink)}

.tag{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-block}
.t-ok{color:var(--ok-fg);border-color:var(--ok-br);background:var(--ok-bg)}
.t-warn{color:var(--warn-fg);border-color:var(--warn-br);background:var(--warn-bg)}
.t-bad{color:var(--bad-fg);border-color:var(--bad-br);background:var(--bad-bg)}
.t-info{color:var(--info-fg);border-color:var(--info-br);background:var(--info-bg)}
.t-idle{color:var(--dim);border-color:var(--border)}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:transparent;color:var(--dim);border:none;padding:6px 14px;font-size:13.5px;cursor:pointer;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;font-weight:700}

/* ---------- responso ---------- */
.verdict{border-radius:var(--radius);padding:18px 22px;margin-bottom:22px;box-shadow:0 12px 32px var(--shadow);border-left:6px solid;background:var(--panel)}
.verdict .k{font-family:var(--f-display);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.verdict .v{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;color:var(--ink);text-wrap:balance}
.verdict p{margin-top:8px;color:var(--dim);max-width:120ch}
.verdict.ok{border-color:var(--moss)} .verdict.ok .k{color:var(--ok-fg)}
.verdict.warn{border-color:#E2A325} .verdict.warn .k{color:var(--warn-fg)}
.verdict.bad{border-color:var(--bad-fg)} .verdict.bad .k{color:var(--bad-fg)}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.kpi{flex:1 1 170px;background:var(--panel);border:1px solid var(--border-2);border-radius:var(--radius);padding:16px 18px;box-shadow:0 8px 24px var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;color:var(--gold);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .n small{font-size:13px;font-weight:600;color:var(--dim)}
.kpi .l{font-size:13.5px;color:var(--dim);margin-top:3px}
.kpi .s{font-size:12.5px;margin-top:6px}
/* cifra con il calcolo spiegato al passaggio del mouse */
.spiega{cursor:help;text-decoration:underline dotted color-mix(in srgb, currentColor 45%, transparent);text-underline-offset:3px}
.banner{background:var(--info-bg);border:1px solid var(--info-br);color:var(--info-fg);border-radius:14px;padding:10px 16px;margin-bottom:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- grafici ---------- */
.chart{background:var(--input);border:1px solid var(--border-2);border-radius:14px;padding:10px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart text{font-family:var(--f-body)}
.chart text.halo{paint-order:stroke;stroke:var(--input);stroke-width:4px;stroke-linejoin:round}
.chart:empty{min-height:120px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.swatch.line{height:3px;width:16px;border-radius:2px}
.hit{cursor:default;outline-offset:1px}
path.hit:hover,path.hit:focus{opacity:.8}
rect.hit{fill:var(--gold);fill-opacity:0}
rect.hit:hover,rect.hit:focus{fill-opacity:.07}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45;white-space:pre-line;max-width:320px;box-shadow:0 8px 24px var(--shadow)}

/* ---------- controlli ---------- */
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border-2);border-radius:14px;padding:12px 16px;background:var(--panel-2)}
.check .tag{flex:none;margin-top:1px}
.check .t{font-weight:600}
.check .d{color:var(--dim);font-size:14px;margin-top:2px;max-width:90ch}

/* ---------- finestra di conferma ---------- */
#modal{position:fixed;inset:0;z-index:300;background:rgba(22,20,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);color:var(--ink);border-radius:var(--radius);padding:22px 24px;max-width:460px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#modal h3{font-size:18px;margin-bottom:8px}
#modal p{color:var(--dim)}
#modal ul{margin:10px 0 0;padding-left:20px;color:var(--dim)}
#modal li{margin:6px 0}
#modal li b{color:var(--ink)}
#modal .box{max-width:520px;outline:none}

/* ---------- guida ---------- */
.guida{max-width:92ch}
.guida h3{font-size:16px;margin:20px 0 6px;color:var(--gold)}
.guida ul{margin:0 0 8px;padding-left:22px}
.guida li{margin:4px 0}
.guida dt{font-weight:600;margin-top:10px}
.guida dd{margin:2px 0 0;color:var(--dim)}
.nota{background:var(--panel-2);border-left:4px solid var(--brass);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:12px}

footer.foot{border-top:1px solid var(--border-2);background:var(--panel);margin-top:20px}
.foot-inner{max-width:min(2100px,96vw);margin:0 auto;padding:18px 22px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.ver{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;color:var(--brass)}
.by{font-family:var(--f-display);font-size:13px;letter-spacing:.28em;color:var(--gold)}

/* ---------- report: foglio sobrio, sempre chiaro, pensato per la stampa ---------- */
.sheet{
  --panel:#FFFFFF; --panel-2:#F6F4FA; --input:#FFFFFF; --border:#D9D5E3; --border-2:#E8E5EF;
  --ink:#1F1C2E; --dim:#5B5670; --faint:#9A96AC; --gold:#5B3FC4; --brass:#7A68B8;
  --ok-bg:#E3F6EE; --ok-fg:#16794F; --ok-br:#B6E5CF; --warn-bg:#FDF3DF; --warn-fg:#8A620A; --warn-br:#F1D9A3;
  --bad-bg:#FDE6EC; --bad-fg:#B42A55; --bad-br:#F4B9CA; --info-bg:#EEF1FD; --info-fg:#4453A6; --info-br:#CCD3F5;
  --c-unfav:#E0457F; --c-fav:#3D8FD9; --c-bar:#9488C8; --c-line:#5B3FC4; --c-grid:#ECE9F3; --c-axis:#B9B4C8; --moss:#22A06B;
  background:#FFFFFF;color:var(--ink);max-width:1000px;margin:0 auto;padding:40px 44px;border:1px solid var(--border-2);border-radius:6px;box-shadow:0 12px 32px var(--shadow);font-size:13.5px;color-scheme:light;
}
.sheet{overflow-x:auto}
.sheet h1{font-size:24px;font-weight:700}
.sheet .meta{color:var(--dim);margin-top:4px;font-size:13px}
.sheet h2{font-size:15px;font-weight:700;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.sheet p{margin:6px 0;max-width:none}
.sheet table{font-size:12.5px}
.sheet th,.sheet td{padding:5px 8px}
.sheet thead th{color:var(--dim);font-size:11px}
.sheet tbody tr:hover{background:none}

<script>
/* ============================================================
   MOTORE DI CALCOLO
   Stesse regole del template CBA aziendale:
   - orizzonte di 10 anni come il template (modificabile da 3 a 20); il primo anno non è scontato (esponente 0)
   - VAN = somma dei flussi netti attualizzati
   - payback = periodo in cui il cumulato passa da negativo a non negativo,
     meno 1, più la quota dell'anno necessaria a chiudere il residuo
   ============================================================ */
let NY = 10;                      /* anni dell'orizzonte in uso */
const NY_MIN = 3, NY_MAX = 20;
function orizzonte(x) { const n = Math.round(parseFloat(x)); return isFinite(n) ? Math.max(NY_MIN, Math.min(NY_MAX, n)) : 10; }
function setNY(n) { NY = orizzonte(n); }
/* esegue fn con un altro orizzonte (serve per valutare un'istantanea salvata con anni diversi) */
function conOrizzonte(n, fn) { const prima = NY; NY = orizzonte(n); try { return fn(); } finally { NY = prima; } }
const CAT_CAPEX = ["Fabbricati", "Macchinari e attrezzature", "Contingency", "Altro"];
const CAT_OPEX = ["Gestione, installazione e ripristino", "Costo del personale", "Costi di trasloco", "Sottoassorbimento", "Altro"];
/* ampiezza del range suggerito in base alla certezza del dato: [sfavorevole, favorevole] in % */
const CERTEZZE = { preventivo: [5, 0], misurato: [10, 5], stima: [20, 10], ipotesi: [30, 10] };

function nz(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
function zeri() { return new Array(NY).fill(0); }
function somma(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; }
function uid() { return Math.random().toString(36).slice(2, 9); }

function nuovaVoce(tipo) {
  return {
    id: uid(), tipo: tipo, nome: "",
    cat: tipo === "capex" ? CAT_CAPEX[1] : tipo === "opex" ? CAT_OPEX[4] : "",
    modo: "man", val: zeri(), qta: zeri(), unitVal: 0, unita: "",
    ins: { spesa: 0, quota: 100, materiali: 0, ore: 0, tariffa: 0, altro: 0, rampa: zeri() },
    fonte: "", certezza: "stima", sfav: 0, fav: 0, gruppo: "", note: ""
  };
}
function nuovoProgetto(anno) {
  return {
    meta: {},
    esempio: false,
    proj: {
      nome: "", pm: "", sito: "", owner: "", dataInizio: "", dataFine: "",
      valuta: "EUR", scala: 1, anno0: anno || new Date().getFullYear(), anni: 10, tasso: 9, pbMax: 5, criterio: "disc",
      background: "", benefici: "", nonMisurabili: "", rischi: "", ipotesi: ""
    },
    voci: [],
    sens: { ritardo: { on: true, anni: 1 }, tasso: { on: true, min: 7, max: 11 }, scenari: [] },
    snap: []
  };
}
/* completa i campi mancanti di un file salvato da una versione precedente */
function migrate(o) {
  const b = nuovoProgetto();
  if (!o || typeof o !== "object" || !o.proj || !Array.isArray(o.voci)) throw new Error("formato");
  o.meta = o.meta || {};
  o.proj = Object.assign({}, b.proj, o.proj);
  o.sens = o.sens || {};
  o.sens.ritardo = Object.assign({}, b.sens.ritardo, o.sens.ritardo);
  o.sens.tasso = Object.assign({}, b.sens.tasso, o.sens.tasso);
  o.sens.scenari = Array.isArray(o.sens.scenari) ? o.sens.scenari : [];
  o.snap = Array.isArray(o.snap) ? o.snap : [];
  o.esempio = !!o.esempio;
  o.proj.anni = orizzonte(o.proj.anni);
  if ([1, 1000, 1000000].indexOf(+o.proj.scala) < 0) o.proj.scala = 1; else o.proj.scala = +o.proj.scala;
  const serie = a => { const n = Math.max(o.proj.anni, Array.isArray(a) ? a.length : 0), z = new Array(n).fill(0); if (Array.isArray(a)) for (let i = 0; i < a.length; i++) z[i] = nz(a[i]); return z; };
  o.voci = o.voci.map(v => {
    const n = Object.assign(nuovaVoce(v.tipo), v);
    if (["ben", "capex", "opex"].indexOf(n.tipo) < 0) n.tipo = "ben";
    if (["man", "driver", "ins"].indexOf(n.modo) < 0) n.modo = "man";
    if (n.modo === "ins" && n.tipo !== "ben") n.modo = "man";
    n.val = serie(n.val); n.qta = serie(n.qta);
    n.ins = Object.assign(nuovaVoce("ben").ins, v.ins || {}); n.ins.rampa = serie(n.ins.rampa);
    return n;
  });
  return o;
}

/* importi annui di una voce, sempre come grandezze positive */
function insNetto(v) {
  const I = v.ins;
  const evitata = nz(I.spesa) * nz(I.quota) / 100;
  const interno = nz(I.materiali) + nz(I.ore) * nz(I.tariffa) + nz(I.altro);
  return { evitata: evitata, interno: interno, netto: evitata - interno };
}
function importi(v) {
  const out = zeri();
  if (v.modo === "driver") { const u = nz(v.unitVal); for (let i = 0; i < NY; i++) out[i] = nz(v.qta[i]) * u; }
  else if (v.modo === "ins") { const n = insNetto(v).netto; for (let i = 0; i < NY; i++) out[i] = n * nz(v.ins.rampa[i]) / 100; }
  else for (let i = 0; i < NY; i++) out[i] = nz(v.val[i]);
  return out;
}
/* allinea l'orizzonte al progetto e allunga le serie delle voci se servono più anni.
   Gli importi oltre l'orizzonte restano salvati ma non entrano nel calcolo. */
function adatta(S) {
  NY = orizzonte(S.proj.anni); S.proj.anni = NY;
  S.voci.forEach(v => { [v.val, v.qta, v.ins.rampa].forEach(a => { while (a.length < NY) a.push(0); }); });
}
function oltreOrizzonte(S, n) {
  return S.voci.some(v => [v.val, v.qta, v.ins.rampa].some(a => a.slice(n).some(x => nz(x) !== 0)));
}
/* moltiplica per k tutti gli importi in denaro (cambio di unità o di valuta), istantanee comprese */
function converti(S, k) {
  const r = x => Math.round(nz(x) * k * 1e9) / 1e9;
  const voci = lista => lista.forEach(v => {
    v.val = v.val.map(r); v.unitVal = r(v.unitVal);
    v.ins.spesa = r(v.ins.spesa); v.ins.materiali = r(v.ins.materiali); v.ins.tariffa = r(v.ins.tariffa); v.ins.altro = r(v.ins.altro);
  });
  voci(S.voci);
  (S.snap || []).forEach(sn => { if (sn.dati && Array.isArray(sn.dati.voci)) voci(sn.dati.voci); });
}
function haImporti(S) { return S.voci.some(v => v.val.some(x => nz(x)) || nz(v.unitVal) || nz(v.ins.spesa) || nz(v.ins.materiali) || nz(v.ins.tariffa) || nz(v.ins.altro)); }
/* slittamento di d anni (anche frazionario: quota f slitta di un anno in più) */
function slitta(a, d) {
  if (!d) return a.slice();
  const n = Math.floor(d), f = d - n, out = zeri();
  for (let i = 0; i < NY; i++) {
    const x = i - n >= 0 ? a[i - n] : 0, y = i - n - 1 >= 0 ? a[i - n - 1] : 0;
    out[i] = (1 - f) * x + f * y;
  }
  return out;
}
function payback(flussi, cumulati) {
  let pb = null;
  for (let i = 1; i < NY; i++) {
    if (cumulati[i - 1] < 0 && cumulati[i] >= 0 && flussi[i] !== 0) {
      const p = i + Math.abs(cumulati[i - 1] / flussi[i]);
      if (pb === null || p > pb) pb = p;
    }
  }
  return pb;
}
function vanDi(net, r) { let s = 0; for (let i = 0; i < net.length; i++) s += net[i] / Math.pow(1 + r, i); return s; }
function tir(net) {
  let lo, hi;
  const f0 = vanDi(net, 0);
  if (f0 > 0) { lo = 0; hi = 10; if (vanDi(net, hi) > 0) return null; }
  else if (f0 < 0) { lo = -0.95; hi = 0; if (vanDi(net, lo) < 0) return null; }
  else return 0;
  for (let k = 0; k < 80; k++) {
    const m = (lo + hi) / 2;
    if ((vanDi(net, m) > 0) === (vanDi(net, lo) > 0)) lo = m; else hi = m;
  }
  return (lo + hi) / 2;
}
function indicatori(net, r) {
  const disc = net.map((x, i) => x / Math.pow(1 + r, i));
  const acc = [], accDisc = [];
  let a = 0, b = 0;
  for (let i = 0; i < NY; i++) { a += net[i]; b += disc[i]; acc.push(a); accDisc.push(b); }
  return { disc: disc, acc: acc, accDisc: accDisc, van: b, pbDisc: payback(disc, accDisc), pbSimple: payback(net, acc), tir: tir(net) };
}

/* valuta il modello; ov = { mult:{idVoce:k}, ritardo:anni, tasso:% , benK:k } */
function valuta(S, ov) {
  ov = ov || {};
  const mult = ov.mult || {};
  const r = (ov.tasso != null ? ov.tasso : nz(S.proj.tasso)) / 100;
  const ben = zeri(), capex = zeri(), opex = zeri(), voci = {};
  S.voci.forEach(v => {
    let a = importi(v);
    const k = mult[v.id] != null ? mult[v.id] : 1;
    if (k !== 1) a = a.map(x => x * k);
    if (v.tipo === "ben") {
      if (ov.benK != null) a = a.map(x => x * ov.benK);
      if (ov.ritardo) a = slitta(a, ov.ritardo);
    }
    voci[v.id] = a;
    const dest = v.tipo === "ben" ? ben : v.tipo === "capex" ? capex : opex;
    for (let i = 0; i < NY; i++) dest[i] += a[i];
  });
  const out = zeri(), net = zeri();
  for (let i = 0; i < NY; i++) { out[i] = capex[i] + opex[i]; net[i] = ben[i] - out[i]; }
  const k = indicatori(net, r);
  k.ben = ben; k.capex = capex; k.opex = opex; k.out = out; k.net = net; k.voci = voci; k.r = r;
  k.pb = S.proj.criterio === "simple" ? k.pbSimple : k.pbDisc;
  return k;
}
function va(a, r) { return vanDi(a, r); }

/* ---------- criteri di approvazione ---------- */
function rispetta(S, k) {
  const pbMax = nz(S.proj.pbMax);
  const vanOk = k.van > 0;
  const pbOk = pbMax > 0 ? (k.pb !== null && k.pb <= pbMax + 1e-9) : true;
  return { vanOk: vanOk, pbOk: pbOk, ok: vanOk && pbOk };
}

/* ---------- variabili di sensitivity ---------- */
function variabili(S) {
  const out = [], gruppi = {};
  S.voci.forEach(v => {
    if (!nz(v.sfav) && !nz(v.fav)) return;
    const parte = { id: v.id, sfav: nz(v.sfav), fav: nz(v.fav) };
    const g = (v.gruppo || "").trim();
    if (g) {
      if (!gruppi[g]) { gruppi[g] = { id: "g:" + g, tipo: "voci", nome: g, parti: [], gruppo: true }; out.push(gruppi[g]); }
      gruppi[g].parti.push(parte);
    } else out.push({ id: "v:" + v.id, tipo: "voci", nome: v.nome, parti: [parte], gruppo: false });
  });
  if (S.sens.ritardo.on && nz(S.sens.ritardo.anni) > 0) out.push({ id: "rit", tipo: "ritardo", anni: nz(S.sens.ritardo.anni) });
  if (S.sens.tasso.on) out.push({ id: "tas", tipo: "tasso", min: nz(S.sens.tasso.min), max: nz(S.sens.tasso.max) });
  return out;
}
/* livello: "u" sfavorevole, "f" favorevole, oppure un numero x lungo la direzione sfavorevole */
function applica(S, vr, livello, ov) {
  ov = ov || {}; ov.mult = ov.mult || {};
  if (livello === "b" || livello == null) return ov;
  if (vr.tipo === "voci") {
    vr.parti.forEach(p => {
      const pct = livello === "u" ? p.sfav : livello === "f" ? p.fav : livello * p.sfav;
      ov.mult[p.id] = Math.max(0, 1 + pct / 100);
    });
  } else if (vr.tipo === "ritardo") {
    ov.ritardo = livello === "u" ? vr.anni : livello === "f" ? 0 : livello;
  } else if (vr.tipo === "tasso") {
    ov.tasso = livello === "u" ? vr.max : livello === "f" ? vr.min : livello;
  }
  return ov;
}
function totaleVar(S, vr, k) { let s = 0; vr.parti.forEach(p => { s += somma(k.voci[p.id] || []); }); return s; }

/* cerca il punto in cui g passa da > 0 (regge) a <= 0 (non regge) fra lo e hi */
function soglia(g, lo, hi) {
  if (!(g(lo) > 0)) return { stato: "base" };
  if (g(hi) > 0) return { stato: "mai" };
  for (let k = 0; k < 70; k++) { const m = (lo + hi) / 2; if (g(m) > 0) lo = m; else hi = m; }
  return { stato: "ok", x: (lo + hi) / 2 };
}
function soglieVar(S, vr, base) {
  const pbMax = nz(S.proj.pbMax);
  const gVan = k => k.van;
  const gPb = k => (k.pb === null ? -1 : pbMax - k.pb);
  let lo = 0, hi, ev;
  if (vr.tipo === "voci") {
    let neg = 0, pos = 0;
    vr.parti.forEach(p => { if (p.sfav < 0) neg = Math.max(neg, -p.sfav); if (p.sfav > 0) pos = Math.max(pos, p.sfav); });
    if (!neg && !pos) return null;
    hi = neg ? 100 / neg : 5000 / pos;
    ev = x => valuta(S, applica(S, vr, x));
  } else if (vr.tipo === "ritardo") { hi = NY; ev = x => valuta(S, { ritardo: x }); }
  else if (vr.tipo === "tasso") { lo = nz(S.proj.tasso); hi = 300; ev = x => valuta(S, { tasso: x }); }
  else if (vr.tipo === "benefici") { hi = 1; ev = x => valuta(S, { benK: 1 - x }); }
  const descrivi = s => {
    if (s.stato !== "ok") { if (s.stato === "mai") s.limite = ev(hi); return s; }
    s.k = ev(s.x);
    if (vr.tipo === "voci") {
      const t0 = totaleVar(S, vr, base), t1 = totaleVar(S, vr, s.k);
      s.totale = t1; s.delta = t0 ? (t1 - t0) / Math.abs(t0) * 100 : 0;
    }
    return s;
  };
  const out = { van: descrivi(soglia(x => gVan(ev(x)), lo, hi)) };
  out.pb = pbMax > 0 ? descrivi(soglia(x => gPb(ev(x)), lo, hi)) : null;
  out.hi = hi;
  return out;
}

/* ---------- scenari ---------- */
function scenario(S, vars, livelli) {
  const ov = { mult: {} };
  vars.forEach(vr => applica(S, vr, livelli[vr.id] || "b", ov));
  return valuta(S, ov);
}

/* ---------- calcolo completo ---------- */
function calcola(S) {
  const base = valuta(S);
  const r = base.r;
  const vars = variabili(S);
  const esito = rispetta(S, base);
  const tornado = vars.map(vr => {
    const u = valuta(S, applica(S, vr, "u")), f = valuta(S, applica(S, vr, "f"));
    const eu = rispetta(S, u);
    return { v: vr, u: u, f: f, regge: eu.ok, eu: eu, soglie: esito.ok ? soglieVar(S, vr, base) : null };
  });
  const tuttiU = {}, tuttiF = {};
  vars.forEach(vr => { tuttiU[vr.id] = "u"; tuttiF[vr.id] = "f"; });
  const scen = [
    { id: "pess", nome: "Pessimistico", fisso: true, livelli: tuttiU },
    { id: "base", nome: "Base", fisso: true, livelli: {} },
    { id: "ott", nome: "Ottimistico", fisso: true, livelli: tuttiF }
  ].concat((S.sens.scenari || []).map(s => ({ id: s.id, nome: s.nome, fisso: false, livelli: s.livelli || {} })));
  scen.forEach(s => { s.k = scenario(S, vars, s.livelli); s.esito = rispetta(S, s.k); });
  const haBen = S.voci.some(v => v.tipo === "ben");
  const benefici = esito.ok && haBen ? soglieVar(S, { tipo: "benefici" }, base) : null;
  /* peso delle voci */
  const pv = {}; let pvBen = 0, pvCosti = 0;
  S.voci.forEach(v => { pv[v.id] = va(base.voci[v.id], r); if (v.tipo === "ben") pvBen += pv[v.id]; else pvCosti += pv[v.id]; });
  const deboli = tornado.filter(t => !t.regge);
  const stato = !esito.ok ? "bad" : deboli.length ? "warn" : "ok";
  return { base: base, vars: vars, tornado: tornado, scen: scen, esito: esito, stato: stato, deboli: deboli, benefici: benefici, pv: pv, pvBen: pvBen, pvCosti: pvCosti };
}

/* ---------- controlli ---------- */
function controlli(S, R) {
  const out = [];
  const add = (sev, cod, par, voce) => out.push({ sev: sev, cod: cod, par: par || [], voce: voce || null });
  const P = S.proj, a0 = Math.round(nz(P.anno0));
  const ben = S.voci.filter(v => v.tipo === "ben"), capex = S.voci.filter(v => v.tipo === "capex"), opex = S.voci.filter(v => v.tipo === "opex");
  const tot = id => somma(R.base.voci[id]);
  if (!ben.length || somma(R.base.ben) === 0) add("err", "noBen");
  if ((!capex.length && !opex.length) || somma(R.base.out) === 0) add("err", "noCosti");
  if (nz(P.tasso) <= 0) add("warn", "tasso0");
  if (!(nz(P.pbMax) > 0)) add("info", "noPbMax");
  if (NY !== 10) add("info", "orizzonteDiverso", [NY]);
  if (somma(R.base.ben) > 0 && somma(R.base.out) > 0) {
    if (!R.esito.vanOk) add("err", "vanNeg");
    if (!R.esito.pbOk) add("err", R.base.pb === null ? "pbMai" : "pbOltre", [R.base.pb, nz(P.pbMax)]);
    R.deboli.forEach(t => add("warn", "nonRegge", [t.v, t.u]));
  }
  /* ultimo anno con benefici, anno di fine progetto */

/* ============================================================
   VERSIONE / LINGUA / TEMA / STATO
   ============================================================ */
const VERSION = "v1.2";
const KEY = "reckoning:state:v1";
let LANG = "it";      /* lingua dell'interfaccia */
let TL = "it";        /* lingua in cui si sta scrivendo adesso (il report può averne una sua) */
let THEME = null;     /* null = segue il sistema */
let S = null, R = null, CK = [];
let DM = 0;           /* decimali degli importi: 0 in unità, 1 in migliaia, 3 in milioni */
const UI = { tab: "progetto", open: {}, fill: {}, cmp: null, rlang: null, snapNome: "", scenNome: "" };

function t(s) { return TL === "it" ? s : (EN[s] !== undefined ? EN[s] : s); }
function tf(s) { const a = arguments; return t(s).replace(/\{(\d)\}/g, (m, i) => a[+i + 1]); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ---------- numeri ---------- */
function grp(s, sep) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, sep); }
function fmt(n, dec) {
  if (n == null || !isFinite(n)) return "–";
  dec = dec == null ? DM : dec;
  const it = TL === "it";
  const parti = Math.abs(n).toFixed(dec).split(".");
  let s = grp(parti[0], it ? "." : ",") + (parti[1] ? (it ? "," : ".") + parti[1] : "");
  if (n < 0 && /[1-9]/.test(s)) s = "−" + s;
  return s;
}
function decimali(n) { const s = (Math.round(n * 1e6) / 1e6).toFixed(6).replace(/\.?0+$/, ""); const i = s.indexOf("."); return i < 0 ? 0 : s.length - i - 1; }
function fmtAuto(n) { return fmt(n, decimali(n)); }
function grezzo(n) { const s = String(Math.round(n * 1e6) / 1e6); return LANG === "it" ? s.replace(".", ",") : s; }
function fmtC(n) {
  if (n == null || !isFinite(n)) return "–";
  const a = Math.abs(n);
  if (a >= 1e6) return fmt(n / 1e6, 2) + " M";
  if (a >= 1e4) return fmt(n / 1e3, 0) + " k";
  return fmt(n, DM);
}
function fmtPct(n, dec) { return fmt(n, dec == null ? 1 : dec) + "%"; }
function sgn(n, dec) { return (n > 0 ? "+" : "") + fmt(n, dec || 0); }
function sgnM(n) { return sgn(n, DM); }
const SCALE = [[1, ""], [1000, "k"], [1000000, "M"]];
function prefisso(scala) { const s = SCALE.find(x => x[0] === +scala); return s ? s[1] : ""; }
function fmtPb(p) { return p == null ? t("non rientra") : fmt(p, 2); }

/* ---------- formule spiegate: passando il mouse su una cifra compare come è stata calcolata ---------- */
function spiega(html, righe) { return '<span class="spiega" title="' + esc(righe.filter(x => x != null && x !== "").join("\n")) + '">' + html + "</span>"; }
const SPG = {
  van(k) {
    return [t("VAN = somma dei flussi netti attualizzati"), tf("flusso dell'anno i ÷ (1 + {0})^i; il primo anno non è scontato", fmtPct(k.r * 100, decimali(k.r * 100)))]
      .concat(k.net.map((x, i) => "  " + anni(i) + ": " + fmt(x) + " ÷ " + fmt(Math.pow(1 + k.r, i), 4) + " = " + fmt(k.disc[i])))
      .concat(["= " + fmt(k.van) + " " + val()]);
  },
  pb(flussi, cum, nome) {
    let i0 = null;
    for (let i = 1; i < NY; i++) if (cum[i - 1] < 0 && cum[i] >= 0 && flussi[i] !== 0) i0 = i;
    if (i0 == null) return [nome, tf("Il cumulato non torna a zero entro {0} anni", NY)].concat(cum.map((x, i) => "  " + anni(i) + ": " + fmt(x)));
    return [nome + " = " + t("anni interi prima del rientro + frazione dell'anno di rientro"),
      tf("cumulato a fine {0}: {1}", anni(i0 - 1), fmt(cum[i0 - 1])), tf("flusso del {0}: {1}", anni(i0), fmt(flussi[i0])),
      i0 + " + " + fmt(Math.abs(cum[i0 - 1])) + " ÷ " + fmt(flussi[i0]) + " = " + fmt(i0 + Math.abs(cum[i0 - 1] / flussi[i0]), 2) + " " + t("anni")];
  },
  tir(k) {
    if (k.tir == null) return [t("TIR = il tasso che porta il VAN a zero"), t("Non esiste un tasso che azzeri il VAN con questi flussi")];
    return [t("TIR = il tasso che porta il VAN a zero"), tf("VAN al {0} = {1} (≈ 0)", fmtPct(k.tir * 100), fmt(vanDi(k.net, k.tir))), tf("Confronto: VAN al tasso richiesto {0} = {1}", fmtPct(k.r * 100, decimali(k.r * 100)), fmt(k.van))];
  },
  serie(titolo, a) { return [titolo].concat(a.map((x, i) => x ? "  " + anni(i) + ": " + fmt(x) : null)).concat(["= " + fmt(somma(a))]); },
  /* le voci di un tipo che compongono un anno */
  anno(tipo, j) {
    const lista = S.voci.filter(v => v.tipo === tipo && R.base.voci[v.id] && R.base.voci[v.id][j]);
    return lista.map(v => "  " + (v.nome || t("(senza nome)")) + ": " + fmt(R.base.voci[v.id][j]) + (v.modo === "driver" ? " (" + fmtAuto(nz(v.qta[j])) + " × " + fmtAuto(nz(v.unitVal)) + ")" : v.modo === "ins" ? " (" + fmt(insNetto(v).netto) + " × " + fmtAuto(nz(v.ins.rampa[j])) + "%)" : ""));
  },
  pv(v) {

    return [t("Valore attuale = somma degli importi attualizzati"), tf("importo dell'anno i ÷ (1 + {0})^i", fmtPct(r * 100, decimali(r * 100)))]

  }
};
function anni(i) { return Math.round(nz(S.proj.anno0)) + i; }

/* legge un numero scritto a mano: solo cifre, segno e un separatore decimale (punto o virgola) */
function leggiNumero(txt) {
  const s = String(txt).replace(/\s/g, "").replace("−", "-");
  if (s === "") return 0;
  if (!/^-?\d+([.,]\d+)?$/.test(s)) return null;
  return parseFloat(s.replace(",", "."));

/* ---------- nomi delle variabili di sensitivity ---------- */
function nomeVar(vr) {
  if (vr.tipo === "ritardo") return t("Ritardo dei benefici");
  if (vr.tipo === "tasso") return t("Tasso di sconto");
  if (vr.tipo === "benefici") return t("Tutti i benefici insieme");
  return vr.nome || t("(senza nome)");
}
function rangeVar(vr) {
  if (vr.tipo === "ritardo") return tf("{0} / nessuno", durata(vr.anni, true));
  if (vr.tipo === "tasso") return fmtPct(vr.max, decimali(vr.max)) + " / " + fmtPct(vr.min, decimali(vr.min));
  const p = vr.parti, uguali = p.every(x => x.sfav === p[0].sfav && x.fav === p[0].fav);
  if (uguali) return sgn(p[0].sfav, decimali(p[0].sfav)) + "% / " + sgn(p[0].fav, decimali(p[0].fav)) + "%";
  /* gruppo con range diversi: variazione effettiva del totale del gruppo */
  let tot = 0, du = 0, df = 0;
  p.forEach(x => { const a = somma((R && R.base.voci[x.id]) || []); tot += a; du += a * Math.max(-100, x.sfav) / 100; df += a * Math.max(-100, x.fav) / 100; });
  if (!tot) return t("range diversi per voce");
  const pc = v => { const r = Math.round(v / tot * 1000) / 10; return sgn(r, decimali(r)) + "%"; };
  return pc(du) + " / " + tf("{0} sul totale", pc(df));
}
function durata(x, segno) {
  const pre = segno ? "+" : "";
  if (x < 1.5 && Math.abs(x - 1) > 0.01) { const m = Math.round(x * 12); return pre + (m === 1 ? t("1 mese") : tf("{0} mesi", m)); }
  if (Math.abs(x - 1) <= 0.01) return pre + t("1 anno");
  return pre + tf("{0} anni", fmt(x, decimali(Math.round(x * 10) / 10)));
}
function tipoNome(tipo) { return tipo === "ben" ? t("Beneficio") : tipo === "capex" ? "CAPEX" : "OPEX"; }

/* ============================================================
   GRAFICI (svg disegnati dalle righe calcolate)
   ============================================================ */
/* barra orizzontale con l'estremo dei dati arrotondato e la base squadrata */
function barraO(x0, x1, y, h) {
  const r = Math.min(4, Math.abs(x1 - x0), h / 2), d = x1 >= x0 ? 1 : -1;
  return "M" + x0 + " " + y + "H" + (x1 - d * r) + "Q" + x1 + " " + y + " " + x1 + " " + (y + r) + "V" + (y + h - r) + "Q" + x1 + " " + (y + h) + " " + (x1 - d * r) + " " + (y + h) + "H" + x0 + "Z";
}
function barraV(x, w, y0, y1) {
  const r = Math.min(4, Math.abs(y1 - y0), w / 2), d = y1 <= y0 ? 1 : -1;
  return "M" + x + " " + y0 + "V" + (y1 + d * r) + "Q" + x + " " + y1 + " " + (x + r) + " " + y1 + "H" + (x + w - r) + "Q" + (x + w) + " " + y1 + " " + (x + w) + " " + (y1 + d * r) + "V" + y0 + "Z";
}
function tronca(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function passo(span, n) {
  const g = span / n, p = Math.pow(10, Math.floor(Math.log10(g))), f = g / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

/* tornado: tipo "van" oppure "pb" */
function grafTornado(tipo, W) {
  const pbMax = nz(S.proj.pbMax), FUORI = NY + 0.5;
  const v = k => tipo === "van" ? k.van : (k.pb == null ? FUORI : k.pb);
  const righe = R.tornado.map(x => ({ x: x, u: v(x.u), f: v(x.f) })).sort((a, b) => Math.abs(b.u - b.f) - Math.abs(a.u - a.f));
  if (!righe.length) return '<p class="empty">' + esc(t("Nessuna variabile: assegna un range ad almeno una voce.")) + "</p>";
  const b = v(R.base);
  let lo = b, hi = b;
  righe.forEach(r => { lo = Math.min(lo, r.u, r.f); hi = Math.max(hi, r.u, r.f); });
  const conLimite = tipo === "pb" && pbMax > 0;
  if (conLimite) { lo = Math.min(lo, pbMax); hi = Math.max(hi, pbMax); }
  const conZero = tipo === "van" && lo <= 0;
  if (hi - lo < 1e-9) { hi = lo + 1; }
  W = W || 760;
  const sx = W < 700 ? 190 : 250, dx = 62, rowH = 46, y0 = 54, bh = 22, nc = W < 700 ? 27 : 36;
  const x = val => sx + dx + (val - lo) / (hi - lo) * (W - sx - 2 * dx);
  const H = y0 + righe.length * rowH + 6;
  const et = n => tipo === "van" ? fmtC(n) : (n >= FUORI ? "> " + NY : fmt(n, 2));
  const unita = tipo === "van" ? val() : t("anni");
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(tipo === "van" ? t("VAN ai due estremi di ogni variabile") : t("Payback ai due estremi di ogni variabile")) + '" font-size="12">';
  righe.forEach((r, i) => {
    const y = y0 + i * rowH, nome = nomeVar(r.x.v);
    s += '<text x="0" y="' + (y + 10) + '" fill="var(--ink)" font-weight="600">' + esc(tronca(nome, nc)) + "</text>";
    s += '<text x="0" y="' + (y + 25) + '" fill="var(--dim)" font-size="11">' + esc(tronca(rangeVar(r.x.v), nc + 6)) + "</text>";
    [["u", r.u, "var(--c-unfav)", t("estremo sfavorevole")], ["f", r.f, "var(--c-fav)", t("estremo favorevole")]].forEach(e => {
      if (Math.abs(e[1] - b) < 1e-9) return;
      const x1 = x(e[1]), tip = nome + "\n" + e[3] + ": " + et(e[1]) + " " + unita;
      s += '<path class="hit" tabindex="0" d="' + barraO(x(b), x1, y, bh) + '" fill="' + e[2] + '" data-tip="' + esc(tip) + '"/>';
      const aDestra = e[1] > b;
      s += '<text x="' + (x1 + (aDestra ? 6 : -6)) + '" y="' + (y + 15) + '" text-anchor="' + (aDestra ? "start" : "end") + '" fill="var(--ink)" class="halo">' + esc(et(e[1])) + "</text>";
    });
  });
  const yFine = y0 + righe.length * rowH - (rowH - bh) + 4;
  /* riferimenti: caso base, limite di payback, VAN zero */
  s += '<line x1="' + x(b) + '" x2="' + x(b) + '" y1="24" y2="' + yFine + '" stroke="var(--c-axis)" stroke-width="1.5"/>';
  const ancora = px => px < sx + 70 ? "start" : px > W - 90 ? "end" : "middle";
  s += '<text x="' + x(b) + '" y="16" text-anchor="' + ancora(x(b)) + '" fill="var(--ink)" font-weight="600">' + esc(tf("Caso base {0}", et(b) + (tipo === "van" ? "" : " " + unita))) + "</text>";
  if (conLimite) {
    s += '<line x1="' + x(pbMax) + '" x2="' + x(pbMax) + '" y1="40" y2="' + yFine + '" stroke="var(--bad-fg)" stroke-width="1.5"/>';
    s += '<text x="' + x(pbMax) + '" y="34" text-anchor="' + ancora(x(pbMax)) + '" fill="var(--bad-fg)" font-weight="600">' + esc(tf("Limite {0} anni", fmt(pbMax, decimali(pbMax)))) + "</text>";
  }
  if (conZero) {
    s += '<line x1="' + x(0) + '" x2="' + x(0) + '" y1="40" y2="' + yFine + '" stroke="var(--bad-fg)" stroke-width="1.5"/>';
    s += '<text x="' + x(0) + '" y="34" text-anchor="' + ancora(x(0)) + '" fill="var(--bad-fg)" font-weight="600">' + esc(t("VAN = 0")) + "</text>";
  }
  return s + "</svg>";
}
function legendaTornado() {
  return '<div class="legend"><span><i class="swatch" style="background:var(--c-unfav)"></i>' + esc(t("Estremo sfavorevole del range")) + '</span><span><i class="swatch" style="background:var(--c-fav)"></i>' + esc(t("Estremo favorevole del range")) + "</span></div>";
}

/* flussi di cassa: barre = flusso netto annuo, linea = cumulato attualizzato */
function grafFlussi(k, W) {
  W = W || 760;
  const H = 300, l = 62, r = 16, top = 26, bot = 30;
  let lo = 0, hi = 0;
  for (let i = 0; i < NY; i++) { lo = Math.min(lo, k.net[i], k.accDisc[i]); hi = Math.max(hi, k.net[i], k.accDisc[i]); }
  if (hi - lo < 1e-9) hi = lo + 1;
  const st = passo(hi - lo, 5);
  lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const band = (W - l - r) / NY, y = v => top + (hi - v) / (hi - lo) * (H - top - bot), cx = i => l + (i + 0.5) * band;
  const bw = Math.min(24, band * 0.5);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("Flusso netto annuo e cumulato attualizzato")) + '" font-size="12">';
  for (let v = lo; v <= hi + st / 2; v += st) {
    s += '<line x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (Math.abs(v) < st / 1e6 ? "var(--c-axis)" : "var(--c-grid)") + '" stroke-width="1"/>';
    s += '<text x="' + (l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" fill="var(--dim)">' + esc(fmtC(Math.abs(v) < st / 1e6 ? 0 : v)) + "</text>";
  }
  for (let i = 0; i < NY; i++) {
    if (k.net[i] !== 0) s += '<path d="' + barraV(cx(i) - bw / 2, bw, y(0), y(k.net[i])) + '" fill="var(--c-bar)"/>';
    if (band >= 44 || i % 2 === 0) s += '<text x="' + cx(i) + '" y="' + (H - 9) + '" text-anchor="middle" fill="var(--dim)">' + anni(i) + "</text>";
  }
  let d = "";
  for (let i = 0; i < NY; i++) d += (i ? "L" : "M") + cx(i) + " " + y(k.accDisc[i]);
  s += '<path d="' + d + '" fill="none" stroke="var(--c-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  for (let i = 0; i < NY; i++) s += '<circle cx="' + cx(i) + '" cy="' + y(k.accDisc[i]) + '" r="4" fill="var(--c-line)" stroke="var(--input)" stroke-width="2"/>';
  if (k.pbDisc != null) {
    const px = l + (k.pbDisc - 0.5) * band;
    s += '<line x1="' + px + '" x2="' + px + '" y1="' + (top - 6) + '" y2="' + y(0) + '" stroke="var(--c-axis)" stroke-width="1.5"/>';
    s += '<text x="' + px + '" y="' + (top - 11) + '" text-anchor="' + (px > W - 150 ? "end" : "middle") + '" fill="var(--ink)" font-weight="600" class="halo">' + esc(tf("Payback attualizzato {0} anni", fmt(k.pbDisc, 2))) + "</text>";
  }
  for (let i = 0; i < NY; i++) {
    const tip = anni(i) + "\n" + t("Flusso netto") + ": " + fmt(k.net[i]) + "\n" + t("Attualizzato") + ": " + fmt(k.disc[i]) + "\n" + t("Cumulato attualizzato") + ": " + fmt(k.accDisc[i]);
    s += '<rect class="hit" tabindex="0" x="' + (l + i * band) + '" y="' + top + '" width="' + band + '" height="' + (H - top - bot) + '" data-tip="' + esc(tip) + '"/>';
  }
  return s + "</svg>";
}
function legendaFlussi() {
  return '<div class="legend"><span><i class="swatch" style="background:var(--c-bar)"></i>' + esc(t("Flusso netto annuo")) + '</span><span><i class="swatch line" style="background:var(--c-line)"></i>' + esc(t("Cumulato attualizzato")) + "</span></div>";
}

/* i grafici si disegnano dopo, alla larghezza reale del riquadro: così il testo non viene ingrandito né rimpicciolito */
function segnaposto(tipo, lingua) { return '<div class="chart" data-g="' + tipo + '"' + (lingua ? ' data-l="' + lingua + '"' : "") + "></div>"; }
function disegnaGrafici(larghezzaFissa) {
  document.querySelectorAll(".chart[data-g]").forEach(el => {
    const cs = getComputedStyle(el);
    let W = larghezzaFissa && el.closest(".sheet") ? larghezzaFissa : Math.floor(el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
    W = Math.max(560, Math.min(1400, W || 760));

    try { el.innerHTML = el.dataset.g === "flussi" ? grafFlussi(R.base, W) : grafTornado(el.dataset.g, W); } finally { TL = prima; }
  });
}

function kpiStriscia() {
  const k = R.base, P = S.proj;
  const crit = P.criterio === "simple" ? t("Payback semplice") : t("Payback attualizzato");
  return '<div class="kpis">' +
    '<div class="kpi"><div class="n">' + spiega(fmt(k.van), SPG.van(k)) + " <small>" + esc(val()) + '</small></div><div class="l">' + esc(tf("VAN al {0}", fmtPct(nz(P.tasso), decimali(nz(P.tasso))))) + "</div></div>" +

function testoVerdetto() {

  if (somma(k.ben) === 0 || somma(k.out) === 0) return { stato: "warn", k: t("Responso"), v: t("Inserisci benefici e costi per avere il responso."), p: "" };

  let base = tf("VAN {0} {1} al {2}.", fmt(k.van), val(), tasso) + " ";
  if (k.pb == null) base += tf("L'investimento non rientra nei {0} anni.", NY);
  else if (pbMax > 0) base += k.pb <= pbMax ? tf("Payback {0} anni: {1} sotto il limite di {2}.", fmt(k.pb, 2), durata(pbMax - k.pb), fmt(pbMax, decimali(pbMax))) : tf("Payback {0} anni: oltre il limite di {1}.", fmt(k.pb, 2), fmt(pbMax, decimali(pbMax)));
  else base += tf("Payback {0} anni.", fmt(k.pb, 2));
  if (R.stato === "bad") return { stato: "bad", k: t("Responso"), v: t("Non rispetta i criteri di approvazione."), p: base };
  if (R.stato === "warn") {
    const nomi = R.deboli.map(x => nomeVar(x.v) + " (" + rangeVar(x.v).split(" / ")[0] + ")").join(", ");
    return { stato: "warn", k: t("Responso"), v: t("Rispetta i criteri, ma con margine ridotto."), p: base + " " + tf("Non regge a: {0}.", nomi) };
  }
  return { stato: "ok", k: t("Responso"), v: R.vars.length ? t("Rispetta i criteri e regge a ogni rischio testato.") : t("Rispetta i criteri. Nessun rischio ancora testato."), p: base };
}

function cellaSoglia(vr, s, quale, hi) {
  if (!s) return "–";
  const pbMax = nz(S.proj.pbMax);
  if (s.stato === "base") return "–";
  if (s.stato === "mai") {
    const resto = quale === "van" ? tf("il VAN resta {0}", fmtC(s.limite.van)) : tf("il payback resta {0}", fmtPb(s.limite.pb));
    if (vr.tipo === "voci") return vr.parti.some(p => p.sfav < 0) ? tf("Mai: anche azzerando la voce {0}", resto) : tf("Mai entro {0}%", sgn(hi * Math.max.apply(null, vr.parti.map(p => p.sfav))));
    if (vr.tipo === "ritardo") return tf("Mai entro {0} anni", NY);
    if (vr.tipo === "tasso") return tf("Mai entro il {0}%", fmt(hi, 0));
    return tf("Mai: anche a zero {0}", resto);
  }
  if (vr.tipo === "voci") return sgn(s.delta, 0) + "% (" + tf("{0} in totale", fmt(s.totale)) + ")";
  if (vr.tipo === "ritardo") return "≈ " + durata(s.x);
  if (vr.tipo === "tasso") return fmtPct(s.x) + (quale === "van" ? " " + t("(è il TIR)") : "");
  return "−" + fmt(s.x * 100, 0) + "%";
}

/* ---------- controlli ---------- */
function testoControllo(c) {
  const n = c.voce ? (c.voce.nome || t("(senza nome)")) : "", p = c.par;
  switch (c.cod) {
    case "noBen": return [t("Nessun beneficio inserito"), t("Aggiungi almeno un beneficio nella scheda Benefici e costi.")];
    case "noCosti": return [t("Nessun costo inserito"), t("Un caso senza CAPEX né OPEX non ha payback: inserisci l'investimento.")];
    case "tasso0": return [t("Tasso di sconto a zero"), t("Con tasso zero il VAN coincide con il flusso netto. Inserisci il tasso aziendale nella scheda Progetto.")];
    case "noPbMax": return [t("Payback massimo non impostato"), t("Senza limite il responso guarda solo il VAN. Impostalo nella scheda Progetto se l'azienda ne richiede uno.")];
    case "vanNeg": return [t("VAN negativo"), t("Ai valori base il progetto rende meno del tasso richiesto.")];
    case "pbOltre": return [t("Payback oltre il limite"), tf("Il payback è {0} anni contro un massimo di {1}.", fmt(p[0], 2), fmt(p[1], decimali(p[1])))];
    case "pbMai": return [t("L'investimento non rientra"), tf("Il flusso cumulato non torna positivo entro i {0} anni.", NY)];
    case "orizzonteDiverso": return [tf("Orizzonte di {0} anni invece di 10", p[0]), t("Il template CBA calcola su 10 anni: VAN e payback dell'app non coincideranno con quelli del template finché gli anni sono diversi.")];
    case "nonRegge": return [tf("Non regge a: {0}", nomeVar(p[0])), tf("All'estremo sfavorevole ({0}) il VAN è {1} e il payback {2}.", rangeVar(p[0]).split(" / ")[0], fmt(p[1].van), fmtPb(p[1].pb))];
    case "regimeSubito": return [tf("{0}: beneficio a regime già nel {1}", n, p[0]), tf("Il progetto finisce nel {0}. Se il beneficio dipende dal progetto, riduci il primo anno; se non dipende, scrivilo nella fonte.", p[1])];
    case "concentrato": return [tf("{0} pesa il {1} dei benefici", n, fmtPct(p[0], 0)), t("Più di metà del caso poggia su una sola voce: è la prima da validare e da testare nella sensitivity.")];
    case "insSenzaCosto": return [tf("{0}: insourcing senza costo interno", n), t("La spesa evitata verso il fornitore non è un guadagno finché non togli il costo per produrre in casa.")];
    case "insNegativo": return [tf("{0}: produrre in casa costa più che comprare", n), t("Il costo interno supera la spesa evitata: il beneficio è nullo o negativo.")];
    case "costoSiFerma": return [tf("{0}: il costo si ferma nel {1}", n, p[0]), tf("I benefici continuano fino al {0}. Se il costo è ricorrente, estendilo.", p[1])];
    case "noContingency": return [t("CAPEX senza contingency"), t("Nessuna voce in categoria Contingency. Se gli importi sono stime, valuta una riserva.")];
    case "vuota": return [tf("{0}: voce senza importi", n), t("Compila gli anni oppure elimina la voce.")];
    case "noRange": return [tf("{0}: manca il range di rischio", n), tf("Pesa il {0} del suo lato e non entra nella sensitivity.", fmtPct(p[0], 0))];
    case "noFonte": return [tf("{0}: manca la fonte del dato", n), tf("Pesa il {0}: chi approva chiederà da dove viene il numero.", fmtPct(p[0], 0))];
    case "trascurabile": return [tf("{0} pesa meno dell'1%", n), t("Verifica l'unità di misura: un importo in migliaia in mezzo a importi in unità produce questo effetto.")];
    case "rangeInvertito": return [tf("{0}: range invertito", n), t("L'estremo sfavorevole migliora il risultato o supera quello favorevole. Per un beneficio lo sfavorevole è negativo, per un costo è positivo.")];
  }
  return [c.cod, ""];
}

/* ============================================================

   ============================================================ */
let saveTimer = null;
/* dentro un artifact di Claude usa il suo storage, altrove quello del browser */
const store = {
  async get(k) {
    if (window.storage && window.storage.get) return await window.storage.get(k);
    const v = window.localStorage.getItem(k);
    return v == null ? null : { key: k, value: v };
  },
  async set(k, v) {
    if (window.storage && window.storage.set) return await window.storage.set(k, v);
    window.localStorage.setItem(k, v);
    return { key: k, value: v };
  }
};
async function salva() {
  S.meta.lang = LANG; S.meta.theme = THEME; S.meta.version = VERSION;
  try { const r = await store.set(KEY, JSON.stringify(S)); if (!r) throw new Error("no"); flag(t("Salvato")); }
  catch (e) { flag(t("Non salvato nel browser: usa Esporta file"), true); }
}
function accodaSalva() { clearTimeout(saveTimer); saveTimer = setTimeout(salva, 700); }
function flag(msg, bad) {
  const el = document.getElementById("savedFlag");
  el.textContent = msg; el.style.fontWeight = bad ? "700" : "400";
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, bad ? 5000 : 1800);
}
async function carica() {
  try {
    const r = await store.get(KEY);
    if (r && r.value) {
      const o = migrate(JSON.parse(r.value));
      if (o.meta.lang === "en" || o.meta.lang === "it") LANG = o.meta.lang;
      if (o.meta.theme === "light" || o.meta.theme === "dark") THEME = o.meta.theme;
      return o;
    }
  } catch (e) { /* nessun dato salvato */ }
  return null;
}
function scarica(nome, testo, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([testo], { type: mime }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function nomeFile(ext) { return "reckoning-" + (S.proj.nome || "progetto").replace(/[^\w\-]+/g, "_").slice(0, 60) + "-" + VERSION + "." + ext; }
function csv() {
  const it = LANG === "it", sep = it ? ";" : ",", k = R.base;
  const n = x => { const s = String(Math.round(x * 1e6) / 1e6); return it ? s.replace(".", ",") : s; };
  const q = s => { s = String(s == null ? "" : s); return /[";,\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const righe = [];
  const riga = (nome, a, segno, tot) => righe.push([q(nome)].concat(a.map(x => n(segno * x))).concat([tot === false ? "" : n(segno * somma(a))]).join(sep));
  const testa = () => righe.push([q(t("Anno"))].concat(Array.from({ length: NY }, (x, i) => anni(i))).concat([q(t("Totale"))]).join(sep));
  righe.push([q(t("Progetto")), q(S.proj.nome)].join(sep));
  righe.push([q(t("Valuta e unità")), q(val())].join(sep));
  righe.push("");
  righe.push(q(t("Benefici"))); testa();
  S.voci.filter(v => v.tipo === "ben").forEach(v => riga(v.nome, k.voci[v.id], 1));
  riga(t("Totale benefici"), k.ben, 1);
  [["capex", "CAPEX", CAT_CAPEX, t("Totale CAPEX"), k.capex], ["opex", "OPEX", CAT_OPEX, t("Totale OPEX"), k.opex]].forEach(g => {
    righe.push(""); righe.push(q(g[1] + " " + t("(segno negativo)"))); testa();
    g[2].forEach(c => { const a = zeri(); S.voci.filter(v => v.tipo === g[0] && v.cat === c).forEach(v => { for (let i = 0; i < NY; i++) a[i] += k.voci[v.id][i]; }); riga(t(c), a, -1); });
    riga(g[3], g[4], -1);
  });
  righe.push(""); testa();
  riga(t("Totale cash out"), k.out, -1); riga(t("Flusso netto"), k.net, 1); riga(t("Flusso cumulato"), k.acc, 1, false); riga(t("Flusso attualizzato"), k.disc, 1); riga(t("Cumulato attualizzato"), k.accDisc, 1, false);
  righe.push("");
  righe.push([q(t("Tasso di sconto %")), n(nz(S.proj.tasso))].join(sep));
  righe.push([q(t("VAN")), n(k.van)].join(sep));
  righe.push([q(t("Payback attualizzato")), k.pbDisc == null ? "" : n(k.pbDisc)].join(sep));
  righe.push([q(t("Payback semplice")), k.pbSimple == null ? "" : n(k.pbSimple)].join(sep));
  righe.push([q(t("TIR")) + " %", k.tir == null ? "" : n(k.tir * 100)].join(sep));
  return "﻿" + righe.join("\r\n");
}

   ============================================================ */
function temaScuro() { return THEME ? THEME === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
function applicaTema() { if (THEME) document.documentElement.setAttribute("data-theme", THEME); else document.documentElement.removeAttribute("data-theme"); }
function ricalcola() {
  adatta(S);
  DM = S.proj.scala === 1000 ? 1 : S.proj.scala === 1000000 ? 3 : 0;
  R = calcola(S); CK = controlli(S, R);
}
function refresh() {
  const att = document.activeElement, id = att && att.id;
  const main = document.getElementById("main");
  const sc = Array.prototype.map.call(main.querySelectorAll(".scroller"), x => x.scrollLeft);
  TL = LANG;
  ricalcola(); renderTesta();
  main.innerHTML = RENDER[UI.tab]();
  disegnaGrafici();
  main.querySelectorAll(".scroller").forEach((x, i) => { if (sc[i]) x.scrollLeft = sc[i]; });
  if (id) {
    const el = document.getElementById(id);
    if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (el.tagName === "INPUT" && el.type === "text" && el.select) el.select(); }
  }
}
let giu = false, inAttesa = false;
function rinfrescaPresto() {
  if (giu) { inAttesa = true; setTimeout(() => { if (inAttesa) { inAttesa = false; refresh(); } }, 450); }
  else setTimeout(refresh, 0);
}
/* finestra con più scelte: bottoni = [{ t: etichetta, cls, fn }]; fn può restituire false per tenerla aperta */
function finestra(titolo, corpoHtml, bottoni, annullato) {
  const m = document.getElementById("modal");
  m.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="mTit" tabindex="-1"><h3 id="mTit">' + esc(titolo) + "</h3>" + corpoHtml + '<div class="row-actions" style="justify-content:flex-end"><button class="act ghost" id="mNo">' + esc(t("Annulla")) + "</button>" + bottoni.map((b, i) => '<button class="act ' + (b.cls || "") + '" id="mB' + i + '">' + esc(b.t) + "</button>").join("") + "</div></div>";
  m.hidden = false;
  const chiudi = () => { m.hidden = true; m.innerHTML = ""; document.removeEventListener("keydown", esc2); };
  const annulla = () => { chiudi(); if (annullato) annullato(); };
  const esc2 = e => { if (e.key === "Escape") annulla(); };
  document.addEventListener("keydown", esc2);
  document.getElementById("mNo").onclick = annulla;
  bottoni.forEach((b, i) => { document.getElementById("mB" + i).onclick = () => { if (b.fn() !== false) chiudi(); }; });
  m.onclick = e => { if (e.target === m) annulla(); };
  /* il fuoco va sulla finestra, non su un pulsante: un Invio premuto nel campo che l'ha aperta non deve confermare nulla */
  const primo = m.querySelector(".box input");
  if (primo) { primo.focus(); primo.select(); } else m.querySelector(".box").focus();
}
function chiedi(titolo, testo, etichetta, fn) { finestra(titolo, "<p>" + esc(testo) + "</p>", [{ t: etichetta, fn: fn }]); }

/* ---------- anni di simulazione, valuta e unità ---------- */
function cambiaAnni(el) {
  const v = leggiNumero(el.value);
  if (v === null || Math.round(v) !== v || v < NY_MIN || v > NY_MAX) { el.classList.add("bad"); flag(tf("Gli anni di simulazione vanno da {0} a {1}", NY_MIN, NY_MAX), true); return; }
  if (v === NY) return;
  const tagliati = v < NY && oltreOrizzonte(S, v);
  S.proj.anni = v; accodaSalva(); rinfrescaPresto();
  if (tagliati) setTimeout(() => flag(tf("Gli importi dopo il {0} restano salvati ma escono dal calcolo", anni(v - 1)), true), 60);
}
function allineaIstantanee() { S.snap.forEach(sn => { if (sn.dati && sn.dati.proj) { sn.dati.proj.valuta = S.proj.valuta; sn.dati.proj.scala = S.proj.scala; } }); }
function cambiaScala(el) {
  const prima = S.proj.scala || 1, dopo = +el.value;
  if (dopo === prima) return;
  const applica = k => { if (k !== 1) converti(S, k); S.proj.scala = dopo; allineaIstantanee(); accodaSalva(); refresh(); };
  if (!haImporti(S)) { applica(1); return; }
  const u0 = prefisso(prima) + S.proj.valuta, u1 = prefisso(dopo) + S.proj.valuta, es = 250000;
  const corpo = "<p>" + esc(tf("Oggi gli importi sono in {0}. Passando a {1} puoi:", u0, u1)) + "</p><ul><li><b>" + esc(t("Convertire gli importi")) + ".</b> " + esc(tf("I numeri vengono ricalcolati: {0} {1} diventa {2} {3}.", fmt(es / prima, decimali(es / prima)), u0, fmt(es / dopo, decimali(es / dopo)), u1)) + "</li><li><b>" + esc(t("Cambiare solo l'etichetta")) + ".</b> " + esc(tf("I numeri restano uguali. Usalo se li avevi già scritti in {0}.", u1)) + "</li></ul>";
  finestra(t("Cambiare l'unità degli importi?"), corpo, [{ t: t("Cambia solo l'etichetta"), cls: "ghost", fn: () => applica(1) }, { t: t("Converti gli importi"), fn: () => applica(prima / dopo) }], refresh);
}
function cambiaValuta(el) {
  const prima = (S.proj.valuta || "").trim(), dopo = el.value.trim();
  if (dopo === prima) return;
  const applica = k => { if (k !== 1) converti(S, k); S.proj.valuta = dopo; allineaIstantanee(); accodaSalva(); refresh(); };
  if (!haImporti(S) || !prima || !dopo) { applica(1); return; }
  const corpo = "<p>" + esc(tf("Oggi gli importi sono in {0}. Passando a {1} puoi convertirli a un cambio oppure cambiare solo l'etichetta, se i numeri erano già in {1}.", prima, dopo)) + '</p><p style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink)"><label for="mRate">' + esc(tf("Cambio: 1 {0} =", prima)) + '</label><input id="mRate" class="num" inputmode="decimal" autocomplete="off" value="' + (LANG === "it" ? "1,00" : "1.00") + '"><span>' + esc(dopo) + "</span></p>";
  finestra(t("Cambiare valuta?"), corpo, [{ t: t("Cambia solo l'etichetta"), cls: "ghost", fn: () => applica(1) }, { t: t("Converti al cambio indicato"), fn: () => {
    const inp = document.getElementById("mRate"), k = leggiNumero(inp.value);
    if (k === null || !(k > 0)) { inp.classList.add("bad"); inp.focus(); return false; }
    applica(k);
  } }], refresh);
}

/* ---------- scrittura nello stato ---------- */
function scrivi(path, v) {
  const tk = path.split(".");
  let o = tk[0] === "ui" ? UI : S, i = tk[0] === "ui" ? 1 : 0;
  for (; i < tk.length - 1; i++) {
    if (tk[i] === "voci" && o === S) { o = S.voci.find(x => x.id === tk[i + 1]); i++; if (!o) return false; continue; }
    if (o[tk[i]] == null) o[tk[i]] = {};
    o = o[tk[i]];
  }
  o[tk[tk.length - 1]] = v;
  return true;
}
function cambia(el) {
  const tipo = el.dataset.t; let v;
  if (tipo === "n" || tipo === "i") {
    v = leggiNumero(el.value);
    if (v === null || (tipo === "i" && Math.round(v) !== v)) { el.classList.add("bad"); flag(t("Numero non valido: usa solo cifre e un separatore decimale"), true); return; }
    if (tipo === "n") { const vuoto = el.value.trim() === ""; el.dataset.raw = vuoto ? "" : grezzo(v); el.dataset.fmt = vuoto ? "" : fmtAuto(v); }
  } else if (tipo === "b") v = el.checked;
  else v = el.value;
  el.classList.remove("bad");
  scrivi(el.dataset.p, v);
  if (el.dataset.p.indexOf("ui.") !== 0) accodaSalva();
  rinfrescaPresto();
}

/* ---------- azioni ---------- */
function clona(o) { return JSON.parse(JSON.stringify(o)); }
function azione(a, arg) {
  inAttesa = false;
  const voce = () => S.voci.find(v => v.id === arg);
  switch (a) {
    case "tab": UI.tab = arg; try { history.replaceState(null, "", "#" + arg); } catch (e) { } refresh(); window.scrollTo(0, 0); return;
    case "lang": LANG = arg; TL = arg; accodaSalva(); refresh(); return;
    case "tema": THEME = temaScuro() ? "light" : "dark"; applicaTema(); accodaSalva(); refresh(); return;
    case "rlang": UI.rlang = arg; refresh(); return;
    case "stampa": window.print(); return;
    case "add": { const v = nuovaVoce(arg); S.voci.push(v); UI.open[v.id] = true; accodaSalva(); refresh(); const el = document.getElementById("v-" + v.id + "-n"); if (el) el.focus(); return; }
    case "tog": UI.open[arg] = !UI.open[arg]; refresh(); return;
    case "dup": { const v = voce(); if (!v) return; const c = clona(v); c.id = uid(); c.nome = tf("{0} (copia)", v.nome); S.voci.splice(S.voci.indexOf(v) + 1, 0, c); UI.open[c.id] = true; accodaSalva(); refresh(); return; }
    case "del": { const v = voce(); if (!v) return; chiedi(t("Eliminare la voce?"), tf("«{0}» verrà tolta dal caso. Se ti serve un confronto, salva prima un'istantanea.", v.nome || t("(senza nome)")), t("Elimina"), () => { S.voci = S.voci.filter(x => x.id !== arg); accodaSalva(); refresh(); }); return; }
    case "sugg": { const v = voce(); if (!v) return; const g = CERTEZZE[v.certezza] || CERTEZZE.stima; v.sfav = v.tipo === "ben" ? -g[0] : g[0]; v.fav = v.tipo === "ben" ? g[1] : -g[1]; accodaSalva(); refresh(); return; }
    case "fill": { const v = voce(), F = UI.fill[arg]; if (!v || !F) return; const arr = v.modo === "driver" ? v.qta : v.modo === "ins" ? v.ins.rampa : v.val; const da = Math.min(nz(F.da), nz(F.a)), al = Math.max(nz(F.da), nz(F.a)); for (let i = da; i <= al && i < NY; i++) arr[i] = nz(F.v); accodaSalva(); refresh(); return; }
    case "vai": UI.tab = "voci"; UI.open[arg] = true; refresh(); { const el = document.getElementById("v-" + arg + "-n"); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } } return;
    case "scenAdd": { const nome = (UI.scenNome || "").trim() || tf("Scenario {0}", S.sens.scenari.length + 1); S.sens.scenari.push({ id: uid(), nome: nome, livelli: {} }); UI.scenNome = ""; accodaSalva(); refresh(); return; }
    case "scenDel": S.sens.scenari = S.sens.scenari.filter(x => x.id !== arg); accodaSalva(); refresh(); return;
    case "snapSave": { const nome = (UI.snapNome || "").trim() || tf("Istantanea {0}", S.snap.length + 1); S.snap.push({ id: uid(), nome: nome, data: new Date().toISOString(), dati: clona({ proj: S.proj, voci: S.voci, sens: S.sens }) }); UI.snapNome = ""; accodaSalva(); refresh(); flag(t("Istantanea salvata")); return; }
    case "snapCmp": UI.cmp = UI.cmp === arg ? null : arg; refresh(); return;
    case "snapDel": { const sn = S.snap.find(x => x.id === arg); if (!sn) return; chiedi(t("Eliminare l'istantanea?"), tf("«{0}» non potrà essere recuperata.", sn.nome), t("Elimina"), () => { S.snap = S.snap.filter(x => x.id !== arg); if (UI.cmp === arg) UI.cmp = null; accodaSalva(); refresh(); }); return; }
    case "snapRip": { const sn = S.snap.find(x => x.id === arg); if (!sn) return; chiedi(t("Ripristinare l'istantanea?"), tf("Il caso attuale verrà sostituito da «{0}». Le modifiche non salvate in un'istantanea andranno perse.", sn.nome), t("Ripristina"), () => { const d = clona(sn.dati); S.proj = d.proj; S.voci = d.voci; S.sens = d.sens; migrate(S); accodaSalva(); refresh(); }); return; }
    case "esporta": S.meta.lang = LANG; S.meta.theme = THEME; S.meta.version = VERSION; scarica(nomeFile("json"), JSON.stringify(S, null, 2), "application/json"); return;
    case "csv": scarica(nomeFile("csv"), csv(), "text/csv;charset=utf-8"); return;
    case "importa": document.getElementById("importFile").click(); return;
    case "nuovo": chiedi(t("Iniziare un nuovo progetto?"), t("Il caso aperto verrà sostituito da un progetto vuoto. Esporta prima il file se vuoi conservarlo."), t("Nuovo progetto"), () => { S = nuovoProgetto(); UI.open = {}; UI.cmp = null; UI.tab = "progetto"; accodaSalva(); refresh(); }); return;
    case "esempio": chiedi(t("Caricare l'esempio?"), t("Il caso aperto verrà sostituito dal progetto di esempio. Esporta prima il file se vuoi conservarlo."), t("Carica l'esempio"), () => { S = esempio(); UI.open = {}; UI.cmp = null; accodaSalva(); refresh(); }); return;
  }
}

/* ============================================================
   AVVIO
   ============================================================ */
function avvia() {
  document.addEventListener("pointerdown", () => { giu = true; }, true);
  const su = () => { giu = false; if (inAttesa) setTimeout(() => { if (inAttesa) { inAttesa = false; refresh(); } }, 0); };
  document.addEventListener("pointerup", su, true);
  document.addEventListener("pointercancel", su, true);
  document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b) azione(b.dataset.a, b.dataset.arg); });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "importFile") {
      const f = el.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try { S = migrate(JSON.parse(rd.result)); S.esempio = false; UI.open = {}; UI.cmp = null; salva(); refresh(); flag(t("File importato")); }
        catch (err) { flag(t("File non leggibile: non è un salvataggio di RECKONING"), true); }
        el.value = "";
      };
      rd.readAsText(f); return;
    }
    if (el.dataset.c === "anni") { cambiaAnni(el); return; }
    if (el.dataset.c === "scala") { cambiaScala(el); return; }
    if (el.dataset.c === "valuta") { cambiaValuta(el); return; }
    if (el.dataset.c === "scenLiv") { const sc = S.sens.scenari.find(x => x.id === el.dataset.sid); if (sc) { sc.livelli[el.dataset.vid] = el.value; accodaSalva(); rinfrescaPresto(); } return; }
    if (el.dataset.c === "scenNome") { const sc = S.sens.scenari.find(x => x.id === el.dataset.sid); if (sc) { sc.nome = el.value; accodaSalva(); rinfrescaPresto(); } return; }
    if (el.dataset.p) cambia(el);
  });
  /* i numeri si mostrano con i separatori e si modificano senza */
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (el.dataset && el.dataset.t === "n" && !el.classList.contains("bad")) { el.value = el.dataset.raw || ""; el.select(); }
    if (el.dataset && el.dataset.tip) mostraTip(el, null);
  });
  document.addEventListener("focusout", e => {
    const el = e.target;
    if (el.dataset && el.dataset.t === "n" && !el.classList.contains("bad") && leggiNumero(el.value) === leggiNumero(el.dataset.raw || "")) el.value = el.dataset.fmt || "";
    if (el.dataset && el.dataset.tip) nascondiTip();
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && (e.target.dataset.p || e.target.dataset.c)) e.target.blur(); });
  /* tooltip dei grafici */
  const tip = document.getElementById("tip");
  function mostraTip(el, ev) {
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const r = el.getBoundingClientRect(), x = ev ? ev.clientX : r.left + r.width / 2, y = ev ? ev.clientY : r.top;
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + "px";
    tip.style.top = Math.max(8, y - hh - 12 < 8 ? y + 18 : y - hh - 12) + "px";
  }
  function nascondiTip() { tip.hidden = true; }
  document.addEventListener("pointermove", e => { const el = e.target.closest ? e.target.closest("[data-tip]") : null; if (el) mostraTip(el, e); else if (!tip.hidden) nascondiTip(); });
  document.addEventListener("scroll", nascondiTip, { passive: true });
  /* intestazione compatta quando si scorre */
  const testa = document.getElementById("top");
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    if (y > 140 && !testa.classList.contains("compact")) testa.classList.add("compact");
    else if (y < 30 && testa.classList.contains("compact")) testa.classList.remove("compact");
  }, { passive: true });
  let tRes = null;
  window.addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(() => disegnaGrafici(), 150); });
  window.addEventListener("beforeprint", () => disegnaGrafici(690));
  window.addEventListener("afterprint", () => disegnaGrafici());
  if (window.matchMedia) { const mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", () => { if (!THEME) refresh(); }); }

  carica().then(o => {
    if (!o && !/^it/i.test(navigator.language || "it")) LANG = "en";
    TL = LANG;
    S = o || esempio();
    applicaTema();
    const h = (location.hash || "").slice(1);
    if (RENDER[h]) UI.tab = h;
    refresh();
  });
}
avvia();
</script>
